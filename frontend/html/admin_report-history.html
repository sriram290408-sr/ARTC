<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report History - ARTC</title>

  <link rel="icon" href="../assets/icon.png" />
  <link rel="stylesheet" href="../css/nav-bar.css" />
  <link rel="stylesheet" href="../css/admin_report-history.css" />
</head>

<body>
  <header>
    <div class="header-left">
      <img src="../assets/icon.png" alt="ARTC Logo" class="logo" />
    </div>

    <div class="user-icon">
      <img src="../assets/profile.png" />
    </div>
  </header>

  <main class="container">
    <a href="./admin.html" class="back-btn">← Back</a>

    <div class="history-header">
      <h2>Case History (Admin)</h2>

      <select id="sortSelect" class="sort-select">
        <option value="latest">Sort by Latest</option>
        <option value="oldest">Sort by Oldest</option>
      </select>
    </div>

    <div id="historyContainer" class="history-container"></div>
  </main>

  <script src="../js/admin_report-history.js"></script>
</body>
</html>
