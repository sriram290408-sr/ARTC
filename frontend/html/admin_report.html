<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint Review - ARTC Admin</title>

    <link rel="icon" href="../assets/icon.png" />
    <link rel="stylesheet" href="../css/nav-bar.css" />
    <link rel="stylesheet" href="../css/admin_report.css" />
  </head>

  <body>
    <header>
      <div class="header-left">
        <img src="../assets/icon.png" alt="ARTC Logo" class="logo" />
      </div>

      <div class="user-icon">
        <img src="../assets/profile.png" width="40" height="40" />
        <span class="dropdown-arrow">▼</span>
        <div class="user-menu">
          <a href="./admin.html">Home</a>
          <a href="./admin_profile.html">Profile</a>
          <a href="./login.html">Logout</a>
        </div>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="./admin.html">Home</a></li>
        <li><a href="./admin_about.html">About</a></li>
        <li><a href="./admin_laws.html">Laws</a></li>
        <li><a href="./admin_committee.html">Committee</a></li>
        <li><a href="./admin_analysis.html">Analysis</a></li>
        <li><a href="./admin_schedule.html">Schedule</a></li>
        <li><a href="./admin_article.html">Article</a></li>
        <li><a href="./admin_report.html" class="active">Report</a></li>
        <li><a href="./admin_contact.html">Contact</a></li>
      </ul>
    </nav>
    <div>
      <a href="./admin_report-history.html" class="history-btn">
        Report History
      </a>
    </div>

    <main class="profile-layout">
      <form id="reportForm" class="card">
        <h2>Complaint Review</h2>
        <p id="caseMeta"></p>

        <h3>Complaint Details</h3>

        <label>Title</label>
        <input id="title" readonly />

        <label>Description</label>
        <textarea id="description" readonly></textarea>

        <label>Problem Type</label>
        <input id="problem_type" readonly />

        <label>Location</label>
        <input id="incident_location" readonly />

        <label>Incident Date</label>
        <input id="incident_date" readonly />

        <hr />

        <h3>Student Details</h3>

        <label>Name</label>
        <input id="name" readonly />

        <label>Class & Section</label>
        <input id="class_section" readonly />

        <label>People Involved</label>
        <input id="people_involved" readonly />

        <hr />

        <h3>Admin Action</h3>

        <div class="admin-action">
          <label>Status</label>
          <select id="status">
            <option value="Pending">Pending</option>
            <option value="Under Review">Under Review</option>
            <option value="Completed">Completed</option>
            <option value="Fake">Fake</option>
          </select>

          <label>Admin Remarks</label>
          <textarea
            id="remarks"
            placeholder="Enter your remarks here..."
          ></textarea>

          <button type="submit" class="save-btn">Update Report</button>

          <p id="formMessage"></p>
        </div>
      </form>
    </main>

    <script src="../js/admin_report.js"></script>
  </body>
</html>
