<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Schedule - ARTC</title>
  <link rel="stylesheet" href="../css/nav-bar.css" />
  <link rel="stylesheet" href="../css/admin_schedule.css" />
</head>

<body>

<header>
  <div class="header-left">
    <img src="../assets/icon.png" class="logo">
  </div>

  <div class="user-icon">
    <img src="../assets/profile.png">
    <span class="dropdown-arrow">▼</span>
    <div class="user-menu">
      <a href="./admin.html">Home</a>
      <a href="./admin_profile.html">Profile</a>
      <a href="./login.html">Logout</a>
    </div>
  </div>
</header>

<nav>
  <ul>
    <li><a href="./admin.html">Home</a></li>
    <li><a href="./admin_schedule.html" class="active">Schedule</a></li>
  </ul>
</nav>

<main>
  <h2>Manage Programme Schedule</h2>

  <form id="scheduleForm" class="schedule-form">
    <input type="text" id="event_name" placeholder="Event Name" required>
    <input type="text" id="venue" placeholder="Venue" required>
    <input type="datetime-local" id="datetime" required>
    <button type="submit">Add Schedule</button>
  </form>

  <button id="deleteBtn" class="delete-btn" style="display:none;">
    Delete Selected
  </button>

  <section class="schedule-container" id="scheduleContainer"></section>
</main>

<script src="../js/admin_schedule.js"></script>
</body>
</html>
